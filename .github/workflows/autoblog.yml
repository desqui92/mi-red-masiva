name: Autoblog Runner 24/7

on:
  schedule:
    - cron: '0 */2 * * *' # Ejecuta cada 2 horas
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    env:
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO_NAME: ${{ secrets.REPO_NAME }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Preparar entorno e inspeccionar culpable
        run: |
          rm -rf venv
          python -m venv venv
          source venv/bin/activate
          pip install --upgrade pip
          
          # Instalamos dependencias
          pip install --no-cache-dir PyGithub google-genai youtube-transcript-api google-api-python-client python-slugify yt-dlp openai httpx
          
          echo "=================================================="
          echo "🔍 DIAGNÓSTICO: ¿Quién carajos instaló httpx2?"
          echo "=================================================="
          pip show httpx2 || echo "✔ httpx2 NO fue instalado por pip directamente."
          
          echo "=================================================="
          echo "🔍 Buscando la palabra httpx2 dentro del código del repo..."
          echo "=================================================="
          grep -rn "httpx2" . --exclude-dir=venv || echo "✔ No hay menciones de httpx2 en tus archivos .py"

      - name: Ejecutar Bot
        run: |
          source venv/bin/activate
          python autoblog_100_master.py
